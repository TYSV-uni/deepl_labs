[project]
name = "lab3"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "numpy==2.3.2",
    "scikit-learn==1.7.1",
    "matplotlib==3.10.5",
    "pillow==11.3.0",
    "tqdm==4.67.1",
]

[project.scripts]
lab3-train = "src.train:main"
lab3-analyze = "src.analysis:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
